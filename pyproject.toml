[project]
name = "market-terminal"
version = "0.1.0"
description = "An after-close NSE market review in the terminal: NIFTY 50 overview, candles, breadth, sectors, who moved the index, watchlist and stock view."
readme = "README.md"
license = "MIT"
authors = [{ name = "Dhirajdas18" }]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pyarrow>=26.0.1",
    "scipy>=1.18.1",
    "textual>=8.2.8",
    "textual-plotext>=1.0.1",
    "yfinance>=1.8.0",
]

[project.scripts]
mt = "mt.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-textual-snapshot>=1.0.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mt"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
