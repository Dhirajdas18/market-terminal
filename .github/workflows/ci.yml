name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest -q
      - name: Audit dependencies
        run: |
          uv export --locked --format requirements-txt --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --strict --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"
      - name: Audit workflows
        run: uvx zizmor==1.33.1 --offline .github/workflows
